<style>
/* Layout: one narrow column like a Telegram screen — brand bar, then one view at a time (home / flat / car / order / prices). */
:root {
  --bg: #F5F6FA;          /* screen ground, cool off-white */
  --card: #FFFFFF;
  --ink: #14213D;         /* navy text */
  --muted: #5B6478;
  --line: #E2E5EE;
  --navy: #1F3864;        /* brand navy */
  --gold: #B8962E;        /* brand gold */
  --gold-soft: #F3ECD7;
  --on-navy: #FFFFFF;
  --good: #2E7D4F;
  --font-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-brand: "Prata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1424; --card: #172036; --ink: #EEF1F8; --muted: #A3ABC0; --line: #283350;
  --navy: #2B4A80; --gold: #D4B45A; --gold-soft: #2E2A1D; --on-navy: #FFFFFF; --good: #6FCB94; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1424; --card: #172036; --ink: #EEF1F8; --muted: #A3ABC0; --line: #283350;
  --navy: #2B4A80; --gold: #D4B45A; --gold-soft: #2E2A1D; --on-navy: #FFFFFF; --good: #6FCB94; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 28px; }
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }

/* brand bar */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 2px; }
.brand .mark { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand b { font-family: var(--font-brand); font-weight: 400; font-size: 26px; letter-spacing: .01em; color: var(--ink); }
.brand b span { color: var(--gold); }
.langs { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: none; color: var(--muted); font: 600 12px var(--font-ui); padding: 5px 9px; border-radius: 999px; cursor: pointer; letter-spacing: .04em; }
.langs button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); }
.slogan { margin: -6px 0 2px; font-size: 13px; color: var(--gold); font-style: italic; }

/* hero card */
.hero { background: var(--navy); color: var(--on-navy); border-radius: 18px; padding: 20px 18px; display: grid; gap: 8px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -56px; bottom: -70px; width: 150px; height: 150px; border-radius: 50%; border: 18px solid var(--gold); opacity: .22; }
.hero h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; text-wrap: balance; max-width: 26ch; }
.hero p { margin: 0; opacity: .85; font-size: 14px; max-width: 34ch; }

/* action list */
.actions { display: grid; gap: 10px; }
.act { display: grid; grid-template-columns: 44px 1fr 16px; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; font: inherit; }
.act:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.act .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--gold-soft); display: grid; place-items: center; }
.act .ic svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.act strong { display: block; font-size: 15px; }
.act small { display: block; color: var(--muted); font-size: 13px; }
.act .chev { color: var(--muted); font-size: 20px; }

/* sections */
.view { display: grid; gap: 14px; }
.head { display: flex; align-items: center; gap: 10px; }
.back { border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 18px; flex: none; }
.head h2 { margin: 0; font-size: 19px; font-weight: 800; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea { width: 100%; font: 500 15px var(--font-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
textarea { resize: vertical; min-height: 70px; }
.field { display: grid; gap: 6px; min-width: 0; }
.flabel { font-size: 13px; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 600 13px var(--font-ui); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: 700 15px var(--font-ui); cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--gold); color: #1A1406; }
.btn.navy { background: var(--navy); color: var(--on-navy); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btns { display: grid; gap: 8px; }

/* result */
.result { border: 1.5px solid var(--gold); background: var(--gold-soft); border-radius: 16px; padding: 16px; display: grid; gap: 6px; }
.result .tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.result .range { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.result .per { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }

/* price list */
.plist { display: grid; }
.plist div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.plist div:last-child { border-bottom: 0; }
.plist span:last-child { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

.contacts { display: grid; gap: 8px; font-size: 14px; }
.contacts .num { font-weight: 700; font-variant-numeric: tabular-nums; user-select: all; }
.ok { display: grid; gap: 8px; text-align: center; padding: 8px 0; }
.ok .big { font-size: 40px; color: var(--good); }
.copybox { white-space: pre-wrap; font-size: 13px; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; user-select: all; }
.foot { text-align: center; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(6px); } to { transform: none; } } }
</style>
</head><body>

<div class="wrap">
  <div class="brand">
    <div class="mark"><b>Ze<span>C</span>ost</b></div>

        <span><strong data-t="actCar"></strong><small data-t="actCarSub"></small></span><span class="chev">›</span>
      </button>
      <button class="act" type="button" data-go="order" id="go-order">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/></svg></span>
        <span><strong data-t="actOrder"></strong><small data-t="actOrderSub"></small></span><span class="chev">›</span>

      <button class="act" type="button" data-go="prices" id="go-prices">

      <button class="btn primary" type="button" id="f-order" data-t="orderExact"></button>
    </div>
    <p class="note" data-t="flatNote"></p>
  </section>

  <!-- CAR -->
  <section class="view" id="v-car" hidden>
    <div class="head"><button class="back" type="button" data-go="home" aria-label="Back">‹</button><h2 data-t="carTitle"></h2></div>
    <div class="card">
      <label><span data-t="make"></span><select id="c-make">
        <option value="chevrolet">Chevrolet</option><option value="byd">BYD</option><option value="kia">Kia</option>
        <option value="hyundai">Hyundai</option><option value="toyota">Toyota</option><option value="vaz">Lada</option>
        <option value="daewoo">Daewoo</option><option value="chery">Chery</option><option value="other" data-t="otherMake"></option></select></label>

      <div class="row">
        <label><span data-t="year"></span><input id="c-year" type="number" inputmode="numeric" min="1990" max="2026" value="2022"></label>
        <label><span data-t="mileage"></span><input id="c-km" type="number" inputmode="numeric" min="0" value="60000"></label>
      </div>

    </div>

      <label><span data-t="comment"></span><textarea id="o-comment"></textarea></label>
      <p class="note" id="o-err" hidden></p>
      <button class="btn primary" type="submit" id="o-send" data-t="send"></button>
      <p class="note" data-t="orderNote"></p>

    <div class="card" id="o-done" hidden>
      <div class="ok"><span class="big">✓</span><strong data-t="doneTitle"></strong><span class="note" data-t="doneText"></span></div>

    <div class="card"><div class="plist" id="p-list"></div><p class="note" data-t="pricesNote"></p></div>

      <span class="note" data-t="cert"></span>
    </div>
    <button class="btn primary" type="button" data-go="order" data-t="actOrder"></button>
  </section>
</div>

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
/* Внутри Telegram platform != 'unknown'. Открыто кнопкой под полем ввода → initData пустой и работает sendData.
   Открыто из «Меню» или по ссылке → sendData недоступен, заявку передаём ссылкой t.me/<бот>?start=... */
const BOT_USERNAME = 'Zecoast_bot';
const inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown');
const viaKeyboard = inTelegram && !tg.initData;
if (tg) { try { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.setAttribute('data-theme', tg.colorScheme); } catch (e) {} }

/* ---------- state ---------- */
let lang = 'ru';
try { lang = localStorage.getItem('zc-lang') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === 'uz' ? 'uz' : 'ru'); } catch (e) {}
if (!T[lang]) lang = 'ru';
let objType = 'flat';
let lastFlat = null;
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

function money(v) {
  const L = T[lang];
  if (v >= 1e9) return (v / 1e9).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ' + L.bln;
  return Math.round(v / 1e6).toLocaleString('ru-RU') + ' ' + L.mln;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const v = t(el.dataset.t); if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const dSel = $('f-district'), keep = dSel.value;
  dSel.innerHTML = DISTRICTS.map(d => `<option value="${d.id}">${d[lang]}</option>`).join('');
  dSel.value = keep || 'chil';
  const pSel = $('o-purpose'), pk = pSel.selectedIndex;
  pSel.innerHTML = t('purposes').map((p, i) => `<option value="${i}">${p}</option>`).join('');
  pSel.selectedIndex = pk > -1 ? pk : 0;
  $('o-type').innerHTML = Object.entries(t('types')).map(([k, v]) => `<button type="button" data-type="${k}" aria-pressed="${k === objType}">${v}</button>`).join('');
  $('p-list').innerHTML = PRICES.map(([k, v]) => `<div><span>${t(k)}</span><span>${lang === 'ru' ? v : v.replace('от ', '').replace('БРВ', lang === 'uz' ? 'BHM' : 'BCA').replace(/^/, lang === 'uz' ? '' : 'from ')}</span></div>`).join('');
  if (lastFlat) calcFlat();
  renderModels();
  updateCarLink();
}

/* ---------- navigation ---------- */
const VIEWS = ['home', 'flat', 'car', 'order', 'prices'];
function go(v) {
  VIEWS.forEach(n => { $('v-' + n).hidden = n !== v; });
  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { try { v === 'home' ? tg.BackButton.hide() : tg.BackButton.show(); } catch (e) {} }
}
if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => go('home')); } catch (e) {} }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; try { localStorage.setItem('zc-lang', lang); } catch (err) {} render(); return; }
  const ty = e.target.closest('[data-type]'); if (ty) { objType = ty.dataset.type; render(); }
});

/* ---------- flat ---------- */
function calcFlat() {
  const d = DISTRICTS.find(x => x.id === $('f-district').value);
  const area = parseFloat($('f-area').value);
  if (!d || !(area > 0)) return;
  const perM2 = d.p * 1e6 * (1 - BARGAIN);
  const mid = perM2 * area, lo = mid * (1 - SPREAD), hi = mid * (1 + SPREAD);
  const res = `${money(lo)} – ${money(hi)} ${t('sum')}`;
  lastFlat = { d: d[lang], a: area, r: $('f-rooms').value, res };
  $('f-range').textContent = res;
  $('f-per').textContent = fill(t('perM2'), { p: (perM2 / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) });
  $('f-basis').textContent = fill(t(d.city ? 'basisCity' : 'basis'), { d: AS_OF, b: BARGAIN * 100, s: SPREAD * 100 });
  const rooms = $('f-rooms').value;
  /* раздел «Квартиры → Продажа» без фильтров */
  /* Uybor: продажа, квартиры, Ташкент, число комнат (проверено 23.11.2026) */
  $('f-olx').href = 'https://uybor.uz/listings?operationType__eq=sale&category__eq=7&region__eq=13&room__in=' + rooms;
  $('f-result').hidden = false; $('f-after').hidden = false;
}
$('f-calc').addEventListener('click', () => { calcFlat(); try { tg && tg.HapticFeedback.impactOccurred('light'); } catch (e) {} });
$('f-order').addEventListener('click', () => {
  objType = 'flat'; render(); go('order');
  if (lastFlat) $('o-comment').value = fill(T[lang].flatMsg, lastFlat);
});

/* ---------- car ---------- */

const MODELS = {
  chevrolet: [['cobalt','Cobalt'],['gentra','Gentra'],['spark','Spark'],['nexia3','Nexia 3'],['nexia2','Nexia 2'],['damas','Damas'],['matiz','Matiz'],['lacetti','Lacetti'],['onix','Onix'],['tracker-2','Tracker 2'],['tracker','Tracker'],['malibu2','Malibu 2'],['malibu','Malibu'],['captiva','Captiva'],['equinox','Equinox'],['tahoe','Tahoe'],['labo','Labo']],
  byd: [['song-plus-dm-i','Song Plus DM-i'],['song-plus-ev','Song Plus EV'],['chazor','Chazor'],['yuan-up','Yuan UP'],['yuan-plus','Yuan Plus'],['han-ev','Han EV'],['seagull','Seagull'],['dolphin','Dolphin'],['seal','Seal'],['qin-l','Qin L'],['leopard-3','Leopard 3']],
  kia: [['k-5','K5'],['sportage','Sportage'],['sorento','Sorento'],['seltos','Seltos'],['rio','Rio'],['cerato','Cerato'],['carnival','Carnival'],['sonet','Sonet'],['k8','K8'],['ev6','EV6']],
  hyundai: [['elantra','Elantra'],['sonata','Sonata'],['tucson','Tucson'],['santa-fe','Santa Fe'],['creta','Creta'],['accent','Accent'],['palisade','Palisade'],['starex','Starex'],['porter','Porter'],['i30','i30']],
  toyota: [['camry','Camry'],['corolla','Corolla'],['land-cruiser','Land Cruiser'],['land-cruiser-prado','Land Cruiser Prado'],['rav-4','RAV 4'],['highlander','Highlander'],['hilux','Hilux'],['yaris','Yaris'],['alphard','Alphard']],
  vaz: [['lada-granta','Granta'],['vesta','Vesta'],['lada-r90','Largus'],['lada-priora','Priora'],['lada-kalina','Kalina'],['xray','XRAY'],['2107','2107'],['2106','2106'],['2121','Нива']],
  daewoo: [['nexia','Nexia'],['nexia_2','Nexia II'],['matiz','Matiz'],['lacetti','Lacetti'],['gentra','Gentra'],['damas','Damas'],['spark','Spark'],['lanos','Lanos'],['tico','Tico']],
  chery: [['tiggo-7-pro-max','Tiggo 7 Pro Max'],['tiggo-8-pro-max','Tiggo 8 Pro Max'],['tiggo-7-pro','Tiggo 7 Pro'],['tiggo-4-pro','Tiggo 4 Pro'],['tiggo-2','Tiggo 2'],['arrizo-8-hybrid','Arrizo 8 Hybrid']],
};
let carModel = 'cobalt';
function modelLabel() { const m = (MODELS[$('c-make').value] || []).find(x => x[0] === carModel); return m ? m[1] : ''; }
function renderModels() {
  const list = MODELS[$('c-make').value] || [];
  $('c-model-field').hidden = !list.length;
  if (!list.some(x => x[0] === carModel)) carModel = '';
  $('c-models').innerHTML = [['', t('allModels')], ...list].map(([slug, name]) =>
    `<button type="button" data-model="${slug}" aria-pressed="${slug === carModel}">${name}</button>`).join('');
}
function updateCarLink() {
  const make = $('c-make').value, y = parseInt($('c-year').value, 10);
  let url = 'https://avtoelon.uz/avto/';
  if (make !== 'other') { url += make + '/'; if (carModel) url += carModel + '/'; }
  if (y > 1900 && y < 2100) url += '?year[from]=' + (y - 1) + '&year[to]=' + (y + 1);
  $('c-olx').href = url;
}
$('c-models').addEventListener('click', e => {
  const b = e.target.closest('[data-model]'); if (!b) return;
  carModel = b.dataset.model; renderModels(); updateCarLink();
});
$('c-make').addEventListener('change', () => { carModel = ''; renderModels(); updateCarLink(); });
$('c-year').addEventListener('input', updateCarLink);
$('c-order').addEventListener('click', () => {
  const mk = $('c-make'); objType = 'car'; render(); go('order');
  $('o-comment').value = fill(T[lang].carMsg, { m: mk.options[mk.selectedIndex].text, mo: modelLabel(), y: $('c-year').value, k: $('c-km').value });
});

/* ---------- order ---------- */
/* Короткая заявка для ссылки t.me/<бот>?start=... (не длиннее 64 символов: A-Z a-z 0-9 _ -) */
function b64url(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function startPayload(lead) {
  const head = 'ma' + ({ ru: 'r', uz: 'u', en: 'e' }[lang] || 'r') + Object.keys(T.ru.types).indexOf(objType)
    + $('o-purpose').value + lead.phone.replace(/\D/g, '').slice(-12) + '-';
  let name = lead.name, enc = b64url(name);
  while (name && head.length + enc.length > 64) { name = name.slice(0, -1); enc = b64url(name); }
  return head + enc;
}
$('o-form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('o-name').value.trim(), phone = $('o-phone').value.trim(), err = $('o-err');
  if (!name) { err.textContent = t('errName'); err.hidden = false; $('o-name').focus(); return; }
  if (phone.replace(/\D/g, '').length < 9) { err.textContent = t('errPhone'); err.hidden = false; $('o-phone').focus(); return; }
  err.hidden = true;
  const lead = { kind: 'lead', lang, object: T.ru.types[objType], purpose: T.ru.purposes[$('o-purpose').value], name, phone, comment: $('o-comment').value.trim() };
  $('o-form').hidden = true;
  if (viaKeyboard) {
    try { tg.sendData(JSON.stringify(lead)); $('o-done').hidden = false; return; } catch (x) { /* ниже — ссылка */ }
  }
  const link = 'https://t.me/' + BOT_USERNAME + '?start=' + startPayload(lead);
  $('o-tglink').href = link;
  if (inTelegram) {
    $('o-fallback').querySelector('[data-t="fbTitle"]').textContent = t('linkTitle');
    $('o-fallback').querySelector('[data-t="fbText"]').textContent = t('linkText');
    $('o-fallback').hidden = false;
    try { tg.openTelegramLink(link); } catch (x) { /* остаётся кнопка */ }
    return;
  }
  $('o-fallback').hidden = false;
});

render();
calcFlat();   /* open with a worked example so the first screen shows what the calculator does */
go('home');
</script>
